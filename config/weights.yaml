# Sub-score weights for the blended overall score (Stage 8).
# Higher sub-score = riskier. Weights are renormalized over whichever
# sub-scores are actually measurable for a company, and `min_components`
# governs whether an overall score is emitted at all.
#
# NOTHING company-specific belongs in this file. No per-company overrides,
# no expected rankings. If you find yourself wanting to add one, the fix is
# upstream in the evidence, not here.

weights:
  vagueness: 0.15
  unsupported_claims: 0.20
  sins_severity: 0.25
  say_do_gap: 0.25
  goalpost_drift: 0.15

# Blend of (weighted sub-scores) vs (mean judge probability * 100).
judge_blend:
  sub_scores: 0.6
  judge_probability: 0.4

# Multiplier applied to `unsupported_claims` when the report carries a
# third-party assurance statement. 1.0 == no credit at all.
#
# Scaled to the ISAE 3000 engagement level rather than granted flat, because
# an assurance page typically covers a handful of named KPIs and says nothing
# about the rest of the report's claims. Limited assurance is a negative-form
# conclusion ("nothing has come to our attention") that the standard itself
# calls substantially lower than reasonable assurance, so it earns little.
assurance_credit:
  reasonable: 0.70    # 30% reduction
  limited: 0.90       # 10% reduction
  unspecified: 0.95   # assurance language present but level not stated
  none: 1.00

# An overall score is suppressed (abstain) unless at least this many of the
# five sub-scores could actually be measured.
min_components: 3

# Confidence caps. These are hard ceilings applied after scoring.
confidence:
  # fewer than this many verified evidence quotes -> confidence capped at "low"
  min_verified_quotes_for_medium: 2
  min_verified_quotes_for_high: 5
  # fewer than this many measurable sub-scores -> capped at "low"
  min_components_for_medium: 3
  min_components_for_high: 4

# Goalpost-drift scoring internals (Stage 6). Company-agnostic.
#
# Two blocks are scored separately and blended over whichever are measurable:
#   ACTUALS  a prior year's published figure was restated, or a metric was
#            redefined mid-series.
#   TARGETS  a published forward commitment was cut, or abandoned while its
#            deadline was still in the future.
#
# The target block carries the heavier per-unit weight because it is the more
# literal reading of "goalpost drift": a restatement moves the MEASUREMENT and
# is frequently a disclosed methodology change, whereas cutting a 2030 target
# moves the GOAL and is a deliberate decision to promise less. Retiring a live
# target is treated as the limit case of cutting it (-100%).
#
# These weights were fixed on that reasoning BEFORE any company was re-scored
# against them, and must not be revisited to make a particular ranking come
# out. If a ranking looks wrong, the fix is more verified evidence upstream.
drift:
  restatement_noise_floor_pct: 0.5
  magnitude_saturation_pct: 30.0
  rate_weight: 0.45
  magnitude_weight: 0.40
  redefinition_weight: 0.15
  # target block
  target_cut_saturation_pct: 50.0   # halving a target is already extreme
  target_rate_weight: 0.60
  target_magnitude_weight: 0.40
  # blend across blocks; renormalized when only one block is measurable, so a
  # company with no target data scores exactly its actuals-only score
  actuals_block_weight: 0.65
  targets_block_weight: 0.35
