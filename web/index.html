<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Greenwash Time Machine</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#141922; --panel2:#1b2130; --line:#26303f;
    --tx:#e7ecf3; --tx2:#9aa7ba; --tx3:#6b7a90;
    --teal:#2dd4bf; --amber:#f5b342; --red:#f2604c; --violet:#8b7cf6; --blue:#5aa9f7;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:var(--blue)}
  .wrap{max-width:1480px;margin:0 auto;padding:0 16px 48px}

  header{border-bottom:1px solid var(--line);background:rgba(11,14,19,.92);
    backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
  .hrow{max-width:1480px;margin:0 auto;padding:12px 16px;display:flex;gap:16px;
    align-items:center;flex-wrap:wrap}
  .brand{font-weight:650;letter-spacing:-.01em;font-size:15px;white-space:nowrap}
  .brand span{color:var(--tx3);font-weight:400}
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{background:var(--panel);border:1px solid var(--line);color:var(--tx2);
    padding:6px 13px;border-radius:999px;cursor:pointer;font-size:13px;
    transition:.15s;font-weight:500}
  .pill:hover{border-color:#3a4759;color:var(--tx)}
  .pill.on{background:var(--tx);color:#0b0e13;border-color:var(--tx);font-weight:600}
  .paste{margin-left:auto;display:flex;gap:6px;align-items:center}
  .paste input{background:var(--panel);border:1px solid var(--line);border-radius:7px;
    padding:7px 11px;color:var(--tx2);width:210px;font-size:13px}
  .paste input:disabled{opacity:.45;cursor:not-allowed}
  .tag{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--tx3);
    border:1px solid var(--line);padding:3px 7px;border-radius:5px}

  .grid{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:16px;margin-top:16px}
  @media(max-width:1080px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  .card h2{margin:0 0 3px;font-size:13px;font-weight:650;letter-spacing:.02em}
  .sub{color:var(--tx3);font-size:12px;margin:0 0 14px}

  .banner{border-radius:9px;padding:12px 14px;font-size:13px;line-height:1.5;
    display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
  .banner.warn{background:rgba(245,179,66,.09);border:1px solid rgba(245,179,66,.3)}
  .banner.info{background:rgba(90,169,247,.08);border:1px solid rgba(90,169,247,.26)}
  .banner b{color:var(--tx)}
  .dot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:6px}

  .scorewrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .bignum{font:650 46px/1 var(--mono);letter-spacing:-.02em}
  .scorelab{font-size:12px;color:var(--tx3);margin-top:5px}
  .abst{font:650 25px/1 var(--mono);color:var(--tx3);letter-spacing:.02em}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--tx3);font-weight:600;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.07em;padding:7px 9px;border-bottom:1px solid var(--line)}
  td{padding:9px;border-bottom:1px solid rgba(38,48,63,.5);vertical-align:top}
  tbody tr:hover{background:rgba(255,255,255,.022)}
  .mono{font-family:var(--mono);font-size:12px}
  .src{color:var(--tx3);font-size:11px;font-family:var(--mono)}
  .up{color:var(--red)} .down{color:var(--teal)}

  .bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:4px}
  .na{height:7px;border-radius:4px;background:repeating-linear-gradient(45deg,
    #212838,#212838 5px,#1a202c 5px,#1a202c 10px)}
  .srow{display:grid;grid-template-columns:150px 1fr 46px;gap:11px;align-items:center;
    padding:8px 0;border-bottom:1px solid rgba(38,48,63,.4)}
  .srow:last-child{border-bottom:0}
  .sname{font-size:12.5px}
  .sval{text-align:right;font-family:var(--mono);font-size:12.5px}
  .why{color:var(--tx3);font-size:11px;margin-top:3px;line-height:1.4}

  .tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:9px 13px;cursor:pointer;color:var(--tx3);font-size:13px;
    border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
  .tab:hover{color:var(--tx2)}
  .tab.on{color:var(--tx);border-bottom-color:var(--teal)}

  .slider{width:100%;accent-color:var(--teal);margin:6px 0}
  .yrs{display:flex;justify-content:space-between;font-family:var(--mono);
    font-size:10.5px;color:var(--tx3)}
  .toggle{display:inline-flex;background:var(--panel2);border-radius:7px;padding:2px;gap:2px}
  .toggle button{background:none;border:0;color:var(--tx3);padding:5px 11px;
    border-radius:5px;cursor:pointer;font-size:11.5px;font-family:inherit;font-weight:500}
  .toggle button.on{background:var(--tx);color:#0b0e13;font-weight:600}

  .lane{border-left:2px solid var(--line);padding-left:13px;margin:9px 0 14px}
  .lane h4{margin:0 0 7px;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.08em;color:var(--tx3);font-weight:600}
  .evt{background:var(--panel2);border-left:2px solid var(--amber);border-radius:0 7px 7px 0;
    padding:8px 11px;margin-bottom:6px;font-size:12px;line-height:1.45}
  .evt .k{font-family:var(--mono);font-size:10.5px;color:var(--amber);
    text-transform:uppercase;letter-spacing:.05em}
  .empty{color:var(--tx3);font-size:12.5px;font-style:italic;padding:10px 0}
  select{background:var(--panel2);border:1px solid var(--line);color:var(--tx);
    border-radius:7px;padding:6px 9px;font-size:12px;font-family:inherit;max-width:100%}
  code{font-family:var(--mono);font-size:11.5px;background:var(--panel2);
    padding:1px 5px;border-radius:4px;color:var(--tx2)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
  .kv dt{color:var(--tx3)} .kv dd{margin:0;font-family:var(--mono)}
  ul.tight{margin:7px 0 0;padding-left:17px;font-size:12.5px;line-height:1.65;color:var(--tx2)}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand">Greenwash Time Machine <span>· disclosure-integrity signal</span></div>
    <div class="pills" id="pills"></div>
    <div class="paste">
      <label for="pasteBox" class="tag" style="border:0;padding:0">Claim</label>
      <input id="pasteBox" placeholder="Paste a claim…" aria-label="Paste a claim to analyse" disabled />
      <span class="tag">live mode off</span>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="loaderr"></div>
  <div class="grid">
    <div id="main"></div>
    <div id="side"></div>
  </div>
</div>

<script src="data.js" onerror="void 0"></script>
<script>
const F = {
  // risk colour ramp: low risk teal -> high risk red
  col(v){ if(v==null) return 'var(--tx3)';
    if(v<20) return 'var(--teal)'; if(v<40) return '#8fd14f';
    if(v<60) return 'var(--amber)'; return 'var(--red)'; },
  num(v,d){ return v==null?'—':Number(v).toLocaleString(undefined,
    {minimumFractionDigits:d==null?0:d,maximumFractionDigits:d==null?2:d}); },
  esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>(
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); },
  file(p){ return String(p||'').split('/').pop(); },
};

const SUBS = [
  ['goalpost_drift','Goalpost drift','restatements & metric redefinitions across reports'],
  ['say_do_gap','Say-do gap','target glidepath vs actual trajectory'],
  ['vagueness','Vagueness','vague / hedged / future-oriented language density'],
  ['unsupported_claims','Unsupported claims','claims with no corroborating verified evidence'],
  ['sins_severity','Seven Sins severity','TerraChoice sin tags weighted by severity'],
];

let DATA={}, CO=null, YR=null, MODE='hindsight', TAB='evidence', METRIC=null;

async function boot(){
  if(window.__GREENWASH_DATA__){ DATA = window.__GREENWASH_DATA__; }
  else {
    try{
      const idx = await (await fetch('public/data/index.json')).json();
      for(const r of idx) DATA[r.company] = await (await fetch(`public/data/${r.company}.json`)).json();
    }catch(e){
      document.getElementById('loaderr').innerHTML =
        `<div class="banner warn" style="margin-top:16px"><span class="dot" style="background:var(--amber)"></span>
         <div><b>No data loaded.</b> Run <code>make all</code> to generate it, then
         <code>make demo</code> to serve this page.</div></div>`;
      return;
    }
  }
  const fromHash = location.hash.replace('#','');
  select(DATA[fromHash] ? fromHash : Object.keys(DATA).sort()[0]);
  window.addEventListener('hashchange', ()=>{
    const c = location.hash.replace('#','');
    if(DATA[c] && c !== CO.summary.company) select(c);
  });
}

function select(c){
  CO = DATA[c];
  if(location.hash.replace('#','') !== c) history.replaceState(null,'','#'+c);
  // Open on the year carrying the most drift rather than the latest year. The
  // most recent year is usually the one NO later report has restated yet, so
  // defaulting there lands the demo on an empty panel.
  const tl = CO.timeline;
  const busiest = tl.slice().sort((a,b)=>b.drift_ids.length-a.drift_ids.length)[0];
  YR = busiest && busiest.drift_ids.length ? busiest.year
     : (tl.length ? tl[tl.length-1].year : null);
  // Default to a metric that actually drifted, so the two report-lines visibly
  // diverge on load. Falling back to scope 1 would often show two identical
  // overlapping lines and bury the whole point of the chart.
  const ms = CO.coverage.did_metrics||[];
  const drifted = CO.drift_events.map(e=>e.canonical_metric).filter(m=>ms.includes(m));
  METRIC = drifted[0] || ms.find(m=>/scope_1/.test(m)) || ms[0] || null;
  render();
}

function render(){ pills(); main(); side(); }

function pills(){
  document.getElementById('pills').innerHTML = Object.keys(DATA).sort().map(c=>
    `<div class="pill ${c===CO.summary.company?'on':''}" onclick="select('${c}')">
       ${F.esc(DATA[c].summary.display_name)}</div>`).join('');
}

/* ------------------------------ main panel ------------------------------ */
function main(){
  const s = CO.summary, cov = CO.coverage;
  const drift = s.sub_scores.goalpost_drift;

  const abstain = `
    <div class="banner warn">
      <span class="dot" style="background:var(--amber)"></span>
      <div><b>Overall verdict withheld.</b> ${F.esc(s.abstain_reasons[0]||'')}
      The measured component below is fully backed by source documents; the rest are
      not estimated, because scoring an unmeasured component as zero would read as
      &ldquo;clean&rdquo;.</div>
    </div>`;

  document.getElementById('main').innerHTML = `
    ${s.abstain ? abstain : ''}
    <div class="card">
      <h2>${F.esc(s.display_name)}</h2>
      <p class="sub">${F.esc(s.headline||'')}</p>
      <div class="scorewrap">
        <div>
          <div class="bignum" style="color:${F.col(drift)}">${drift==null?'<span class="abst">N/A</span>':F.num(drift,1)}</div>
          <div class="scorelab">Goalpost drift &nbsp;·&nbsp; 0–100, higher = riskier</div>
        </div>
        <div style="border-left:1px solid var(--line);padding-left:22px">
          <div class="bignum" style="font-size:26px;color:var(--tx3)">ABSTAIN</div>
          <div class="scorelab">Overall greenwashing likelihood</div>
        </div>
        <div style="border-left:1px solid var(--line);padding-left:22px">
          <div class="bignum" style="font-size:26px">${s.peer_percentile==null?'—':F.num(s.peer_percentile,0)+'<span style="font-size:15px;color:var(--tx3)">th</span>'}</div>
          <div class="scorelab">Peer percentile ${s.peer_percentile!=null?'(n='+peerN()+', indicative)':''}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>How confident are we, and why</h2>
      <p class="sub">Confidence is capped by evidence available, never by how strong the number looks.</p>
      <div class="banner info" style="margin:0">
        <span class="dot" style="background:var(--blue)"></span>
        <div><b style="text-transform:uppercase;font-size:11px;letter-spacing:.06em">${F.esc(s.confidence)}</b>
        &nbsp;—&nbsp;${F.esc(s.confidence_rationale)}</div>
      </div>
      <div style="margin-top:13px">${SUBS.map(([k,n,d])=>subRow(k,n,d)).join('')}</div>
    </div>

    <div class="card">
      <div class="tabs">
        ${[['evidence','Drift evidence'],['claims','Claims'],['investor','Investor view'],
           ['eval','Eval'],['method','Method']]
          .map(([k,l])=>`<div class="tab ${TAB===k?'on':''}" onclick="setTab('${k}')">${l}</div>`).join('')}
      </div>
      ${TAB==='evidence'?tabEvidence():TAB==='claims'?tabClaims():
        TAB==='investor'?tabInvestor():TAB==='eval'?tabEval():tabMethod()}
    </div>`;
}

function peerN(){ return Object.values(DATA)
  .filter(d=>d.summary.sub_scores.goalpost_drift!=null).length; }

function subRow(k,name,desc){
  const v = CO.summary.sub_scores[k];
  const reason = (CO.summary.abstain_reasons||[]).find(r=>r.startsWith(k+':'));
  return `<div class="srow">
    <div><div class="sname">${name}</div><div class="why">${F.esc(desc)}</div></div>
    <div>${v==null?`<div class="na"></div><div class="why">${F.esc(reason?reason.split(': ').slice(1).join(': '):'not measurable')}</div>`
      :`<div class="bar"><i style="width:${v}%;background:${F.col(v)}"></i></div>`}</div>
    <div class="sval" style="color:${v==null?'var(--tx3)':F.col(v)}">${v==null?'n/a':F.num(v,1)}</div>
  </div>`;
}

function tabEvidence(){
  const ev = CO.drift_events;
  if(!ev.length) return `<p class="empty">No drift events detected.</p>`;
  return `<p class="sub">Every row below is a figure the company itself published twice, differently.
    Sources and pages are cited so each can be checked against the PDF.</p>
    <table><thead><tr><th>Data yr</th><th>Metric</th><th>First reported</th>
      <th>Restated to</th><th>Δ</th><th>Source</th></tr></thead><tbody>
    ${ev.map(e=>{
      const m=e.magnitude_pct;
      return `<tr>
        <td class="mono">${e.year}</td>
        <td>${F.esc(e.canonical_metric||'')}<div class="src">${e.type.replace(/_/g,' ')}</div></td>
        <td class="mono">${F.esc(e.old)}</td>
        <td class="mono">${F.esc(e.new)}</td>
        <td class="mono ${m==null?'':m>0?'up':'down'}">${m==null?'—':(m>0?'+':'')+F.num(m,1)+'%'}</td>
        <td class="src">${F.esc(F.file(e.old_source))} →<br>${F.esc(F.file(e.new_source))}${e.page?' p.'+e.page:''}</td>
      </tr>`;}).join('')}
    </tbody></table>`;
}

function tabClaims(){
  return `<div class="banner warn" style="margin:0">
    <span class="dot" style="background:var(--amber)"></span>
    <div><b>No claims extracted.</b> Claim extraction (Stage 2), Seven Sins tagging (Stage 4),
    evidence retrieval (Stage 5) and the debate court (Stage 7) all require an Anthropic API key,
    which is not set in this environment. The pipeline code is in place; set
    <code>ANTHROPIC_API_KEY</code> and run <code>make claims sins evidence debate</code>.</div></div>
  <p class="sub" style="margin-top:14px">Once populated, this tab shows each claim with its
  Seven Sins tags, severity, and a drawer containing the Prosecutor / Defense / Judge summary
  plus verified evidence quotes with page numbers and supports/contradicts badges.</p>`;
}

function tabInvestor(){
  const rows = Object.values(DATA).map(d=>({
    n:d.summary.display_name, g:d.summary.sub_scores.goalpost_drift,
    p:d.summary.peer_percentile, e:d.drift_events.length, r:d.coverage.n_did_rows}))
    .sort((a,b)=>(b.g==null?-1:b.g)-(a.g==null?-1:a.g));
  return `<p class="sub">Disclosure integrity as a transition-risk overlay. This is a
    <b>data-quality</b> signal, not an emissions forecast: it measures how stable a company's own
    reported history is. Frequent, large restatements mean any model consuming that history is
    fitting to a moving target — a reason to widen error bars on the issuer.</p>
    <table><thead><tr><th>Company</th><th>Drift</th><th>Pctile</th>
      <th>Events</th><th>DiD rows</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${F.esc(r.n)}</td>
      <td class="mono" style="color:${F.col(r.g)}">${r.g==null?'n/a':F.num(r.g,1)}</td>
      <td class="mono">${r.p==null?'—':F.num(r.p,0)}</td>
      <td class="mono">${r.e}</td><td class="mono">${r.r}</td></tr>`).join('')}
    </tbody></table>
    <ul class="tight">
      <li><b>Screen:</b> flag issuers whose restatement rate exceeds a peer threshold before
      relying on their reported intensity series.</li>
      <li><b>Litigation overlay:</b> restatements that move a <i>baseline</i> year are the ones
      regulators cite, since they alter progress-against-target arithmetic retroactively.</li>
      <li><b>Caveat:</b> n=${peerN()} scored peers. Percentiles are indicative only, and
      no return claim is implied.</li>
    </ul>`;
}

function tabEval(){
  return `<div class="banner info" style="margin:0"><span class="dot" style="background:var(--blue)"></span>
    <div>No LLM predictions exist yet, so agreement rate, per-sin precision/recall and Brier score
    are not computable. The drift signal is deterministic arithmetic over the verified CSVs and is
    checkable by hand rather than statistically.</div></div>
    <p class="sub" style="margin-top:14px"><b>Held-out analyst prior.</b> A human hypothesis was
    recorded in <code>eval/analyst_prior.md</code> <i>before</i> scoring and deliberately kept out of
    all prompts, weights and config, so it can be used to check the pipeline rather than steer it.
    See that file for the comparison.</p>`;
}

function tabMethod(){
  const b = CO.coverage;
  return `<dl class="kv">
      <dt>Reports parsed</dt><dd>${b.n_documents}</dd>
      <dt>Verified DiD rows</dt><dd>${b.n_did_rows}</dd>
      <dt>Data years</dt><dd>${(b.did_years||[]).join(', ')||'—'}</dd>
      <dt>Metrics</dt><dd>${(b.did_metrics||[]).length}</dd>
      <dt>Stages run</dt><dd>${(b.stages_completed||[]).join(', ')}</dd>
      <dt>Stages blocked</dt><dd>${Object.keys(b.stages_blocked||{}).join(', ')||'none'}</dd>
    </dl>
    <ul class="tight">
      <li><b>Goalpost drift</b> = 0.45·(restatement rate) + 0.40·min(median |Δ%| / 30, 1)
        + 0.15·min(25·redefinitions, 100). Rate needs a denominator, so a company that never
        publishes the same metric-year twice returns <i>unmeasurable</i>, not zero.</li>
      <li><b>Noise floor:</b> restatements under 0.5% are treated as rounding and dropped.</li>
      <li><b>Source of truth:</b> hand-verified <code>data/did/{company}.csv</code>; every value
        was checked as a literal substring of its cited page.</li>
      <li><b>No company-specific configuration</b> exists anywhere in the pipeline.</li>
    </ul>`;
}

function setTab(t){ TAB=t; main(); }

/* ---------------------------- time machine ------------------------------ */
function side(){
  const tl = CO.timeline, yrs = tl.map(t=>t.year);
  if(!yrs.length){ document.getElementById('side').innerHTML =
    `<div class="card"><h2>Time machine</h2><p class="empty">No timeline data.</p></div>`; return; }
  const cur = tl.find(t=>t.year===YR) || tl[tl.length-1];
  const score = MODE==='as_of' ? cur.score_as_of : cur.score_hindsight;
  const ev = CO.drift_events.filter(e=>cur.drift_ids.includes(e.drift_id))
    .filter(e=>MODE==='hindsight' || pubYear(e.new_source)<=cur.year);

  document.getElementById('side').innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div><h2>Time machine</h2><p class="sub" style="margin:0">Scrub to replay what was known when</p></div>
        <div class="toggle">
          <button class="${MODE==='as_of'?'on':''}" onclick="setMode('as_of')">As of then</button>
          <button class="${MODE==='hindsight'?'on':''}" onclick="setMode('hindsight')">Hindsight</button>
        </div>
      </div>
      <div style="margin-top:14px">
        <input class="slider" type="range" min="0" max="${yrs.length-1}"
          value="${Math.max(0,yrs.indexOf(cur.year))}" oninput="setYear(${JSON.stringify(yrs)}[this.value])" />
        <div class="yrs">${yrs.map(y=>`<span style="${y===cur.year?'color:var(--teal);font-weight:700':''}">${y}</span>`).join('')}</div>
      </div>
      <div style="margin-top:16px;display:flex;align-items:baseline;gap:11px">
        <div class="bignum" style="font-size:31px;color:${F.col(score)}">${score==null?'<span style="font-size:19px;color:var(--tx3)">no drift</span>':F.num(score,0)}</div>
        <div class="scorelab">drift intensity in ${cur.year}${MODE==='as_of'?' · as known by '+cur.year:''}</div>
      </div>
      ${MODE==='as_of'&&cur.score_hindsight!=null&&cur.score_as_of==null?
        `<div class="banner warn" style="margin-top:12px"><span class="dot" style="background:var(--amber)"></span>
         <div>In ${cur.year} this year looked clean. The restatement that reveals it had
         <b>not been published yet</b> — switch to Hindsight to see it.</div></div>`:''}
    </div>

    <div class="card">
      <h2>SAID</h2><p class="sub">Pledges, targets and claims made that year</p>
      <div class="lane"><h4>claims</h4>
        <p class="empty">Awaiting Stage 2 (needs API key).</p></div>
      <h2 style="margin-top:6px">DID</h2><p class="sub">What the data actually shows</p>
      ${metricPicker()}
      ${chart()}
      <div class="lane" style="margin-top:12px"><h4>drift events · ${cur.year}</h4>
        ${ev.length?ev.map(e=>`<div class="evt">
            <div class="k">${e.type.replace(/_/g,' ')}</div>
            ${F.esc(e.description)}</div>`).join(''):'<p class="empty">None.</p>'}
      </div>
    </div>`;
}

function pubYear(s){ const m=/(\d{4})_/.exec(F.file(s)||''); return m?+m[1]:9999; }
function setMode(m){ MODE=m; side(); }
function setYear(y){ YR=y; side(); }
function setMetric(m){ METRIC=m; side(); }

function metricPicker(){
  const ms = CO.coverage.did_metrics||[];
  if(!ms.length) return '';
  return `<select onchange="setMetric(this.value)" style="margin:6px 0 10px">
    ${ms.map(m=>`<option value="${F.esc(m)}" ${m===METRIC?'selected':''}>${F.esc(m)}</option>`).join('')}
  </select>`;
}

/* Two lines: the series as told by each report that published it. Where they
   diverge, that divergence IS the goalpost drift. */
function chart(){
  const rows = CO.did_points.filter(p=>p.metric===METRIC);
  if(!rows.length) return `<p class="empty">No series for this metric.</p>`;
  const bySrc = {};
  for(const r of rows) (bySrc[r.source] ||= []).push(r);
  const srcs = Object.keys(bySrc).sort();
  const W=380,H=170,P={l:48,r:12,t:12,b:26};
  const xs=[...new Set(rows.map(r=>r.year))].sort((a,b)=>a-b);
  const vals=rows.map(r=>r.value);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(lo===hi){lo=lo*0.95;hi=hi*1.05||1;}
  const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  const X=y=>P.l+(xs.length<2?0:(xs.indexOf(y)/(xs.length-1))*(W-P.l-P.r));
  const Y=v=>P.t+(1-(v-lo)/(hi-lo))*(H-P.t-P.b);
  const cols=['var(--teal)','var(--amber)','var(--violet)'];
  const unit=rows[0].unit;

  const paths=srcs.map((s,i)=>{
    const pts=bySrc[s].slice().sort((a,b)=>a.year-b.year);
    const d=pts.map((p,j)=>`${j?'L':'M'}${X(p.year).toFixed(1)},${Y(p.value).toFixed(1)}`).join(' ');
    return `<path d="${d}" fill="none" stroke="${cols[i%3]}" stroke-width="2"
       stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map(p=>`<circle cx="${X(p.year).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="2.8"
        fill="${cols[i%3]}"><title>${p.year}: ${F.num(p.value,2)} ${F.esc(p.unit)}\n${F.esc(F.file(s))}</title></circle>`).join('')}`;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${[0,.5,1].map(f=>{const v=lo+(hi-lo)*f;return `
      <line x1="${P.l}" x2="${W-P.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"
        stroke="var(--line)" stroke-width="1"/>
      <text x="${P.l-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" fill="var(--tx3)"
        font-size="9" font-family="ui-monospace,monospace">${abbr(v)}</text>`}).join('')}
    ${xs.map(y=>`<text x="${X(y).toFixed(1)}" y="${H-8}" text-anchor="middle"
       fill="var(--tx3)" font-size="9" font-family="ui-monospace,monospace">${y}</text>`).join('')}
    ${paths}
  </svg>
  <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--tx3);margin-top:5px">
    ${srcs.map((s,i)=>`<span><span style="display:inline-block;width:9px;height:2px;
      background:${cols[i%3]};vertical-align:middle;margin-right:5px"></span>${F.esc(F.file(s))}</span>`).join('')}
    <span style="margin-left:auto">${F.esc(unit)}</span>
  </div>
  ${srcs.length>1?`<div class="why" style="margin-top:6px">Two reports, one metric. Where the
    lines separate, the company restated its own history.</div>`:''}`;
}

function abbr(v){ const a=Math.abs(v);
  if(a>=1e9) return (v/1e9).toFixed(1)+'B'; if(a>=1e6) return (v/1e6).toFixed(1)+'M';
  if(a>=1e3) return (v/1e3).toFixed(0)+'k'; return (a<10?v.toFixed(1):v.toFixed(0)); }

boot();
</script>
</body>
</html>
