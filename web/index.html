<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Restated</title>
<style>
  :root{
    --bg:#f3eee4; --paper:#fffdf7; --paper2:#f7f1e6; --ink:#1c1814;
    --ink2:#5a5348; --ink3:#8a8174; --rule:#d9cfc0; --rule2:#c9bba8;
    --leaf:#2a6b4f; --leaf2:#3d8b68; --rust:#b4412e; --amber:#c4841d;
    --violet:#6b4c9a; --blue:#2f6f9a; --hl:#f3e0a8;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;overflow-x:hidden}
  body{background:
      radial-gradient(1200px 500px at 10% -10%, #efe6d4, transparent 55%),
      radial-gradient(900px 400px at 110% 0%, #e8dcc8, transparent 50%),
      var(--bg);
    color:var(--ink);
    font:16px/1.55 var(--sans);
    -webkit-font-smoothing:antialiased}
  a{color:var(--blue)}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 22px 64px}

  header{border-bottom:1px solid var(--rule);background:rgba(243,238,228,.92);
    backdrop-filter:blur(10px);position:sticky;top:0;z-index:20}
  .mast{max-width:1180px;margin:0 auto;padding:14px 22px 12px;
    display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap}
  .brand{font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1}
  .brand small{display:block;font-family:var(--sans);font-size:10px;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{background:transparent;border:1px solid var(--rule2);color:var(--ink2);
    padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px;
    transition:.18s;font-weight:550}
  .pill:hover{border-color:var(--ink);color:var(--ink)}
  .pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .tag{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);
    border:1px solid var(--rule);padding:3px 7px;border-radius:5px}
  .try-btn{margin-left:auto;background:var(--paper);border:1px solid var(--rule2);
    color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;
    font:650 13px/1 var(--sans);transition:.18s}
  .try-btn:hover,.try-btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .try-layer{position:fixed;inset:0;z-index:40;background:rgba(28,24,20,.28);
    opacity:0;visibility:hidden;pointer-events:none;overflow:hidden;
    transition:opacity .2s,visibility .2s}
  .try-layer.on{opacity:1;visibility:visible;pointer-events:auto}
  .try-panel{position:absolute;top:0;right:0;bottom:0;width:min(460px,92vw);
    background:var(--paper);border-left:1px solid var(--rule);
    transform:translateX(100%);transition:transform .25s ease;
    padding:22px 22px 36px;overflow-y:auto;
    box-shadow:-16px 0 40px rgba(28,24,20,.12)}
  .try-layer.on .try-panel{transform:none}
  .try-panel h2{margin:0;font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:-.02em}
  .try-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
  .try-close{background:none;border:1px solid var(--rule);color:var(--ink2);
    width:32px;height:32px;border-radius:999px;cursor:pointer;font:650 16px/1 var(--sans)}
  .try-close:hover{border-color:var(--ink);color:var(--ink)}
  .try-panel textarea{width:100%;min-height:220px;resize:vertical;background:var(--bg);
    border:1px solid var(--rule2);border-radius:12px;padding:16px 18px;color:var(--ink);
    font:18px/1.5 var(--serif);display:block}
  .try-panel textarea:focus{outline:2px solid rgba(42,107,79,.25);border-color:var(--leaf)}
  .try-out{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}

  .card{background:var(--paper);border:1px solid var(--rule);border-radius:16px;
    padding:22px 24px;margin-bottom:18px;box-shadow:0 1px 0 rgba(28,24,20,.03)}
  .card h2{margin:0 0 4px;font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:-.02em}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--leaf);margin:0 0 6px}
  .sub{color:var(--ink3);font-size:13px;margin:0 0 14px}

  .banner{border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.5;
    display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
  .banner.warn{background:#f8ead3;border:1px solid #e6c98a}
  .banner.info{background:#e7eef4;border:1px solid #c5d4e0}
  .banner b{color:var(--ink)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}

  .scorewrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .scorelab{font-size:12px;color:var(--ink3);margin-top:6px;text-align:center}
  .abst{font:650 22px/1 var(--serif);color:var(--ink3)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--ink3);font-weight:700;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.08em;padding:8px 8px;border-bottom:1px solid var(--rule)}
  td{padding:10px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
  tbody tr:hover{background:rgba(28,24,20,.025)}
  .mono{font-family:var(--mono);font-size:12.5px}
  .src{color:var(--ink3);font-size:11px;font-family:var(--mono)}
  .up{color:var(--rust)} .down{color:var(--leaf)}

  .bar{height:8px;background:var(--paper2);border-radius:99px;overflow:hidden;border:1px solid var(--rule)}
  .bar>i{display:block;height:100%;border-radius:99px}
  .na{height:8px;border-radius:99px;background:repeating-linear-gradient(45deg,
    #eee6d6,#eee6d6 5px,#e4dccb 5px,#e4dccb 10px)}
  .srow{display:grid;grid-template-columns:160px 1fr 48px;gap:12px;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--rule)}
  .srow:last-child{border-bottom:0}
  .sname{font-size:13.5px;font-weight:600}
  .sval{text-align:right;font-family:var(--mono);font-size:13px}
  .why{color:var(--ink3);font-size:12px;margin-top:3px;line-height:1.45}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:10px 14px;cursor:pointer;color:var(--ink3);font-size:13.5px;
    border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--ink);border-bottom-color:var(--leaf)}

  .toggle{display:inline-flex;background:var(--paper2);border:1px solid var(--rule);
    border-radius:999px;padding:3px;gap:2px}
  .toggle button{background:none;border:0;color:var(--ink3);padding:8px 16px;
    border-radius:999px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:650}
  .toggle button.on{background:var(--ink);color:var(--bg)}

  .empty{color:var(--ink3);font-size:13.5px;font-style:italic;padding:10px 0}
  select{background:var(--paper);border:1px solid var(--rule2);color:var(--ink);
    border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;max-width:100%}
  code{font-family:var(--mono);font-size:12px;background:var(--paper2);
    padding:1px 5px;border-radius:4px;color:var(--ink2)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
  .kv dt{color:var(--ink3)} .kv dd{margin:0;font-family:var(--mono)}
  ul.tight{margin:7px 0 0;padding-left:18px;font-size:13.5px;line-height:1.7;color:var(--ink2)}

  mark{color:inherit;border-radius:2px;padding:0 2px}
  mark.hl-vague{background:#f4c7bf}
  mark.hl-hedge{background:#f3e0a8}
  mark.hl-verify{background:#c9e4d4}
  mark.hl-positive{background:#ddd0f0}
  mark.hl-qty,mark.hl-deadline,mark.hl-baseline{background:#cfe0ef}
  .hl-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin:6px 0 14px}
  .claimcard{background:var(--paper2);border:1px solid var(--rule);border-radius:12px;
    padding:14px 16px;margin:0 0 12px}
  .claimcard .meta{font-size:11px;color:var(--ink3);font-family:var(--mono);margin-bottom:8px}
  .sinchip{display:inline-block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
    border:1px solid #e0b2aa;color:var(--rust);background:#f8e8e4;padding:2px 7px;
    border-radius:999px;margin:8px 4px 0 0}
  .paste-panel{display:none}
  .paste-panel.on{display:block}

  /* ---- magazine pieces ---- */
  .lead{display:grid;grid-template-columns:minmax(0,1.4fr) auto;gap:28px;align-items:center}
  @media(max-width:860px){.lead{grid-template-columns:1fr}}
  .display{font-family:var(--serif);font-size:clamp(36px,5vw,56px);line-height:.95;
    letter-spacing:-.03em;margin:0 0 10px;font-weight:700}
  .deck{font-size:17px;line-height:1.45;color:var(--ink2);margin:0;max-width:46rem}

  .machine{position:relative;overflow:hidden}
  .machine:before{content:"";position:absolute;inset:auto -8% -40% auto;width:280px;height:280px;
    background:radial-gradient(circle,rgba(42,107,79,.08),transparent 70%);pointer-events:none}
  .mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .year-rail{display:flex;align-items:center;gap:0;margin:18px 0 8px;overflow-x:auto;padding:4px 0}
  .year-pill{appearance:none;border:1px solid var(--rule2);background:var(--paper);
    color:var(--ink2);font:650 14px/1 var(--serif);padding:10px 16px;cursor:pointer;
    border-radius:999px;transition:.2s;position:relative;z-index:1}
  .year-pill:hover{border-color:var(--ink);color:var(--ink)}
  .year-pill.on{background:var(--leaf);border-color:var(--leaf);color:#f4efe6;transform:translateY(-1px)}
  .year-join{height:2px;flex:1;min-width:18px;background:var(--rule2);margin:0 4px}
  .mode-cap{font-size:14px;color:var(--ink2);margin:10px 0 0;font-style:italic;font-family:var(--serif)}

  .mspread{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(220px,0.65fr);gap:22px;margin-top:8px}
  @media(max-width:960px){
    .mspread{grid-template-columns:1fr}
    .mspread>.gauge-col{flex-direction:row;gap:18px;text-align:left;justify-content:flex-start;
      padding:12px 18px}
    .mspread>.gauge-col .scorelab,.mspread>.gauge-col .why{text-align:left}
  }
  .chartbox{background:linear-gradient(#fffdf7,#f7f1e6);border:1px solid var(--rule);
    border-radius:14px;padding:14px 12px 10px}
  .gauge-col{display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:8px 4px}
  .gnum{font-family:var(--serif);font-size:34px;font-weight:700;line-height:1;margin-top:-8px}

  .saiddid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
  @media(max-width:800px){.saiddid{grid-template-columns:1fr}}
  .pull{border-left:3px solid var(--leaf);padding:2px 0 2px 14px}
  .pull h3{margin:0 0 6px;font-family:var(--serif);font-size:18px}
  .claim-mini{font-size:14px;line-height:1.5;margin:0 0 10px;color:var(--ink)}

  .evt{background:var(--paper2);border:1px solid var(--rule);border-left:3px solid var(--amber);
    border-radius:0 12px 12px 0;padding:11px 13px;margin-bottom:8px;font-size:13px;line-height:1.45;
    animation:rise .45s ease both}
  .evt .k{font-family:var(--mono);font-size:10.5px;color:var(--amber);
    text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:3px}
  .evt:nth-child(2){animation-delay:.06s}
  .evt:nth-child(3){animation-delay:.12s}
  .evt:nth-child(4){animation-delay:.18s}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .path-draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw .9s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .dot-pop{transform-origin:center;animation:pop .4s ease both}
  @keyframes pop{from{opacity:0;r:0}to{opacity:1}}

  .ico{width:18px;height:18px;vertical-align:-3px;margin-right:6px}
  .rule-orn{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin:6px 0 16px}
  .rule-orn:before,.rule-orn:after{content:"";flex:1;height:1px;background:var(--rule2)}
</style>
</head>
<body>
<header>
  <div class="mast">
    <div class="brand">Restated</div>
    <div class="pills" id="pills"></div>
    <button class="try-btn" id="tryBtn" type="button" onclick="openTry()">Try a claim</button>
  </div>
</header>

<div class="try-layer" id="tryLayer" onclick="if(event.target===this) closeTry()">
  <aside class="try-panel" id="tryDrawer" aria-hidden="true" aria-labelledby="tryTitle">
    <div class="try-head">
      <div>
        <p class="kicker" id="tryTitle">Try a claim</p>
        <h2>Paste a sentence</h2>
      </div>
      <button class="try-close" type="button" onclick="closeTry()" aria-label="Close">×</button>
    </div>
    <textarea id="pasteBox" placeholder="Paste a sentence from a sustainability report…"
      aria-label="Paste a claim to analyse" oninput="onPaste(this.value)"></textarea>
    <div id="pastePanel"></div>
  </aside>
</div>

<div class="wrap">
  <div id="loaderr"></div>
  <div id="machine"></div>
  <div id="dossier"></div>
</div>

<script src="data.js" onerror="void 0"></script>
<script>
const ICO = {
  leaf:`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19c8-1 13-8 14-15-8 1-14 7-14 15z"/><path d="M5 19c3-6 8-10 14-12"/></svg>`,
  clock:`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>`,
  quote:`<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M7 17c-2 0-4-2-4-5 0-4 3-7 7-8l.5 2C8 7 7 9 7 11h3v6H7zm10 0c-2 0-4-2-4-5 0-4 3-7 7-8l.5 2c-2.5 1-3.5 3-3.5 5h3v6h-3z"/></svg>`,
  warn:`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4l9 16H3L12 4z"/><path d="M12 10v5M12 17.5v.5"/></svg>`,
};

const F = {
  col(v){ if(v==null) return 'var(--ink3)';
    if(v<20) return 'var(--leaf)'; if(v<40) return 'var(--leaf2)';
    if(v<60) return 'var(--amber)'; return 'var(--rust)'; },
  num(v,d){ return v==null?'—':Number(v).toLocaleString(undefined,
    {minimumFractionDigits:d==null?0:d,maximumFractionDigits:d==null?2:d}); },
  esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>(
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); },
  file(p){ return String(p||'').split('/').pop(); },
  paint(text, spans){
    if(!text) return '';
    if(!spans||!spans.length) return F.esc(text);
    const ordered = spans.slice().sort((a,b)=>a.start-b.start);
    let out='', i=0;
    for(const s of ordered){
      const a=Math.max(0,s.start), b=Math.min(text.length,s.end);
      if(b<=a || a<i) continue;
      out += F.esc(text.slice(i,a));
      out += `<mark class="hl-${F.esc(s.kind)}">${F.esc(text.slice(a,b))}</mark>`;
      i=b;
    }
    return out + F.esc(text.slice(i));
  },
};

function lex(){ return window.__GREENWASH_LEX__ || {}; }

function analyzeClaim(text){
  const L = lex();
  const low = text.toLowerCase();
  const words = text.match(/[A-Za-z][A-Za-z'-]*/g) || [];
  const n = words.length;
  const hits = (arr)=> (arr||[]).reduce((a,t)=>a+(low.match(new RegExp('\\b'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','g'))||[]).length,0);
  const spans = [];
  const addKind = (kind, arr)=>{
    (arr||[]).forEach(t=>{
      const re = new RegExp('\\b'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');
      let m; while((m=re.exec(text))) spans.push({start:m.index,end:m.index+m[0].length,kind,term:m[0]});
    });
  };
  addKind('vague', L.vague); addKind('hedge', L.hedging);
  addKind('verify', L.verification); addKind('positive', L.positive_tone);
  const qty = text.match(/(\d[\d,]*(?:\.\d+)?)\s*(%|per ?cent|tCO2e|tonnes?|metric tons?|MMT)/i);
  const deadline = text.match(/\b(?:by|before|until)\s+(?:the\s+end\s+of\s+)?((?:19|20)\d{2})/i);
  const baseline = text.match(/(?:versus|vs\.?|compared (?:with|to)|from)\s+((?:19|20)\d{2})/i)
    || text.match(/((?:19|20)\d{2})\s+base\s?(?:line|year)/i);
  const scope = /scope\s*[123]|own operations|value chain|supply chain/i.test(text);
  const verified = hits(L.verification)>0;
  const present = [!!qty, !!baseline, !!deadline, scope, verified].filter(Boolean).length;
  let spec = present/5;
  const vague = n? hits(L.vague)/n : 0, hedge = n? hits(L.hedging)/n : 0;
  spec = Math.max(0, Math.min(1, spec - Math.min(0.3, (vague+hedge)*4)));
  const sins = [];
  if(spec<=0.25 && (vague+hedge)>0 && !qty)
    sins.push({sin:'vagueness', rationale:'unquantified and leans on vague/hedging vocabulary'});
  if(qty && !verified && spec>=0.2)
    sins.push({sin:'no_proof', rationale:'measurable assertion with no verifier named in the sentence'});
  if(/\b(certifi\w*|accredit\w*|standard|verified|approved|compliant|label|seal)\b/i.test(text)
     && !/\b(SBTi|GOTS|FSC|ISO\s?\d|GHG Protocol|CDP|GRI|Deloitte|EY|KPMG|PwC|SGS|DNV)\b/i.test(text))
    sins.push({sin:'false_labels', rationale:'certification language without a named body'});
  return {text, spec, vague, hedge, qty: qty&&qty[0], deadline: deadline&&deadline[1],
    baseline: baseline&&baseline[1], scope, verified, sins, spans, n};
}

function setTry(open){
  const layer = document.getElementById('tryLayer');
  const drawer = document.getElementById('tryDrawer');
  layer.classList.toggle('on', open);
  document.getElementById('tryBtn').classList.toggle('on', open);
  drawer.setAttribute('aria-hidden', open ? 'false' : 'true');
  document.body.style.overflowY = open ? 'hidden' : '';
  if(open) setTimeout(()=>document.getElementById('pasteBox').focus(), 280);
}
function openTry(){ setTry(true); }
function closeTry(){ setTry(false); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeTry(); });

function onPaste(v){
  const panel = document.getElementById('pastePanel');
  if(!v || v.trim().length<8){ panel.className='paste-panel'; panel.innerHTML=''; return; }
  if(!lex().vague){ panel.className='paste-panel on';
    panel.innerHTML='<p class="empty">Lexicons not loaded — open from the web/ folder after <code>make score</code>.</p>';
    return; }
  const a = analyzeClaim(v.trim());
  panel.className='paste-panel on';
  panel.innerHTML = `<div class="try-out">
    <div style="font-size:18px;line-height:1.5;font-family:var(--serif)">${F.paint(a.text, a.spans)}</div>
    <div class="hl-legend">
      <span>specificity <b style="color:${a.spec>=0.4?'var(--leaf)':a.spec>=0.2?'var(--amber)':'var(--rust)'}">${a.spec.toFixed(2)}</b></span>
      <span>qty ${a.qty?a.qty:'—'}</span>
      <span>deadline ${a.deadline||'—'}</span>
      <span>baseline ${a.baseline||'—'}</span>
      ${a.sins.map(s=>`<span class="sinchip">${F.esc(s.sin)}</span>`).join('')}
    </div>
  </div>`;
}

const SUBS = [
  ['goalpost_drift','Restatements','same figure, two reports'],
  ['say_do_gap','Say–do','target vs actual path'],
  ['vagueness','Vagueness','vague / hedged wording'],
  ['unsupported_claims','No proof','no verifier named'],
  ['sins_severity','Flags','classic greenwash patterns'],
];
const TABS = [
  ['evidence','The figures'],
  ['language','The words'],
  ['claims','The claims'],
  ['investor','Compare'],
];

let DATA={}, CO=null, YR=null, TAB='evidence', METRIC=null;

function shortDeck(s){
  const h = (s.headline||'').split(/\s+Language:/)[0].trim();
  return h || s.display_name;
}
function apiish(t){
  return /anthropic|api[_ ]?key|claude|llm|stage5|stage7|verified evidence quotes/i.test(t||'');
}

function gauge(val, label){
  const v = val==null ? null : Math.max(0, Math.min(100, val));
  const r=42, c=2*Math.PI*r, dash = v==null ? 0 : (v/100)*c;
  const col = F.col(v);
  return `<div class="gauge-col">
    <svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--rule)" stroke-width="8"/>
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="8"
        stroke-linecap="round" transform="rotate(-90 60 60)"
        stroke-dasharray="${dash} ${c}" style="transition:stroke-dasharray .6s ease"/>
    </svg>
    <div class="gnum" style="color:${col}">${v==null?'n/a':F.num(v,0)}</div>
    <div class="scorelab">${label}</div>
  </div>`;
}

async function boot(){
  if(window.__GREENWASH_DATA__){ DATA = window.__GREENWASH_DATA__; }
  else {
    try{
      const idx = await (await fetch('public/data/index.json')).json();
      for(const r of idx) DATA[r.company] = await (await fetch(`public/data/${r.company}.json`)).json();
      if(!window.__GREENWASH_LEX__)
        window.__GREENWASH_LEX__ = await (await fetch('public/data/lexicons.json')).json();
    }catch(e){
      document.getElementById('loaderr').innerHTML =
        `<div class="banner warn" style="margin-top:16px"><span class="dot" style="background:var(--amber)"></span>
         <div><b>No data loaded.</b> From the <code>web/</code> folder run
         <code>python3 -m http.server 8000</code>.</div></div>`;
      return;
    }
  }
  const [hCo, hTab] = location.hash.replace('#','').split('/');
  if(hTab && TABS.some(([k])=>k===hTab)) TAB = hTab;
  select(DATA[hCo] ? hCo : Object.keys(DATA).sort()[0]);
  window.addEventListener('hashchange', ()=>{
    const c = location.hash.replace('#','').split('/')[0];
    if(DATA[c] && c !== CO.summary.company) select(c);
  });
}

function select(c){
  CO = DATA[c];
  history.replaceState(null,'','#'+c+(TAB!=='evidence'?'/'+TAB:''));
  const tl = CO.timeline || [];
  const busiest = tl.slice().sort((a,b)=>b.drift_ids.length-a.drift_ids.length)[0];
  YR = busiest && busiest.drift_ids.length ? busiest.year
     : (tl.length ? tl[tl.length-1].year : null);
  const ms = CO.coverage.did_metrics||[];
  const drifted = (CO.drift_events||[]).map(e=>e.canonical_metric).filter(m=>ms.includes(m));
  METRIC = drifted[0] || ms.find(m=>/scope_1/.test(m)) || ms[0] || null;
  render();
}

function render(){ pills(); machine(); dossier(); }

function pills(){
  document.getElementById('pills').innerHTML = Object.keys(DATA).sort().map(c=>
    `<div class="pill ${c===CO.summary.company?'on':''}" onclick="select('${c}')">
       ${F.esc(DATA[c].summary.display_name)}</div>`).join('');
}

/* ------------------------------ time machine ------------------------------ */
function machine(){
  const s = CO.summary;
  const tl = CO.timeline||[], yrs = tl.map(t=>t.year);
  const cur = tl.find(t=>t.year===YR) || tl[tl.length-1];
  const ev = (CO.drift_events||[]).filter(e=>e.year===YR && e.type!=='wording_softened');

  document.getElementById('machine').innerHTML = `
    <div class="card">
      <div class="lead">
        <div>
          <p class="kicker">${ICO.leaf} ${F.esc(s.display_name)}</p>
          <h1 class="display">${F.esc(s.display_name)}</h1>
          <p class="deck">${F.esc(shortDeck(s))}</p>
        </div>
        <div class="scorewrap" style="justify-content:flex-end">
          ${gauge(s.sub_scores.goalpost_drift, 'Restatements')}
          ${gauge(s.overall_score, 'Risk')}
        </div>
      </div>
    </div>

    <div class="card machine">
      <div class="mhead">
        <div>
          <p class="kicker">${ICO.clock} The numbers</p>
          <h2>${cur?cur.year:'—'}</h2>
          <p class="mode-cap">One chart. Each line is a report. If the lines split, the company changed the number.</p>
        </div>
        ${metricPicker()}
      </div>

      ${yrs.length?`<div class="year-rail" role="tablist" aria-label="Report years">
        ${yrs.map((y,i)=>`
          ${i?'<span class="year-join"></span>':''}
          <button class="year-pill ${y===YR?'on':''}" onclick="setYear(${y})">${y}</button>
        `).join('')}
      </div>`:'<p class="empty">No timeline data.</p>'}

      <div class="chartbox">${chart()}</div>

      <div class="saiddid">
        <div class="pull">
          <h3>${ICO.quote} Said</h3>
          ${cur?saidLane(cur.year):'<p class="empty">—</p>'}
        </div>
        <div class="pull" style="border-left-color:var(--amber)">
          <h3>${ICO.warn} Moved</h3>
          ${ev.length?ev.slice(0,4).map(e=>`<div class="evt">
              <div class="k">${e.type.replace(/_/g,' ')} · ${e.year}</div>
              ${F.esc((e.canonical_metric||'')+(e.magnitude_pct!=null?'  '+(e.magnitude_pct>0?'+':'')+F.num(e.magnitude_pct,1)+'%':''))}</div>`).join('')
            +(ev.length>4?`<div class="why">+${ev.length-4} more in The figures</div>`:'')
            :'<p class="empty">None.</p>'}
        </div>
      </div>
    </div>`;
}

function saidLane(year){
  const cs = (CO.claims||[]).filter(c=>c.publish_year===year);
  if(!cs.length) return `<p class="empty">No extracted claims for ${year}.</p>`;
  const top = cs.slice().sort((a,b)=>
    (b.features?.specificity_score||0)-(a.features?.specificity_score||0)).slice(0,2);
  return top.map(c=>`<p class="claim-mini">${F.paint((c.claim_text||'').slice(0,160), (c.features||{}).highlights)}</p>`).join('');
}

function setYear(y){ YR=y; machine(); }
function setMetric(m){ METRIC=m; machine(); }

function metricPicker(){
  const ms = CO.coverage.did_metrics||[];
  if(!ms.length) return '';
  return `<select onchange="setMetric(this.value)">
    ${ms.map(m=>`<option value="${F.esc(m)}" ${m===METRIC?'selected':''}>${F.esc(m)}</option>`).join('')}
  </select>`;
}

function chart(){
  const rows = (CO.did_points||[]).filter(p=>p.metric===METRIC);
  if(!rows.length) return `<p class="empty">No series for this metric.</p>`;
  const bySrc = {};
  for(const r of rows) (bySrc[r.source] ||= []).push(r);
  const srcs = Object.keys(bySrc).sort();
  const W=720,H=230,P={l:52,r:16,t:16,b:32};
  const xs=[...new Set(rows.map(r=>r.year))].sort((a,b)=>a-b);
  const vals=rows.map(r=>r.value);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(lo===hi){lo=lo*0.95;hi=hi*1.05||1;}
  const pad=(hi-lo)*0.14; lo-=pad; hi+=pad;
  const X=y=>P.l+(xs.length<2?0:(xs.indexOf(y)/(xs.length-1))*(W-P.l-P.r));
  const Y=v=>P.t+(1-(v-lo)/(hi-lo))*(H-P.t-P.b);
  const cols=['var(--leaf)','var(--amber)','var(--violet)'];
  const unit=rows[0].unit;

  const paths=srcs.map((s,i)=>{
    const pts=bySrc[s].slice().sort((a,b)=>a.year-b.year);
    const d=pts.map((p,j)=>`${j?'L':'M'}${X(p.year).toFixed(1)},${Y(p.value).toFixed(1)}`).join(' ');
    return `<path class="path-draw" d="${d}" fill="none" stroke="${cols[i%3]}" stroke-width="2.4"
       stroke-linejoin="round" stroke-linecap="round" style="animation-delay:${i*90}ms"/>
      ${pts.map((p,j)=>`<circle class="dot-pop" style="animation-delay:${200+j*70}ms"
        cx="${X(p.year).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="4"
        fill="${cols[i%3]}" stroke="var(--paper)" stroke-width="1.5">
        <title>${p.year}: ${F.num(p.value,2)} ${F.esc(p.unit)}
${F.esc(F.file(s))}</title></circle>`).join('')}`;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${[0,.5,1].map(f=>{const v=lo+(hi-lo)*f;return `
      <line x1="${P.l}" x2="${W-P.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"
        stroke="var(--rule)" stroke-width="1"/>
      <text x="${P.l-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" fill="var(--ink3)"
        font-size="11" font-family="ui-monospace,monospace">${abbr(v)}</text>`}).join('')}
    ${xs.map(y=>`<text x="${X(y).toFixed(1)}" y="${H-10}" text-anchor="middle"
       fill="${y===YR?'var(--leaf)':'var(--ink3)'}" font-size="12"
       font-weight="${y===YR?'700':'500'}" font-family="Iowan Old Style,Palatino,serif">${y}</text>`).join('')}
    ${YR!=null?`<line x1="${X(YR).toFixed(1)}" x2="${X(YR).toFixed(1)}" y1="${P.t}" y2="${H-P.b}"
      stroke="var(--leaf)" stroke-dasharray="3 4" stroke-width="1.2" opacity=".55"/>`:''}
    ${paths}
  </svg>
  <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);margin-top:8px;padding:0 6px">
    ${srcs.map((s,i)=>`<span><span style="display:inline-block;width:14px;height:3px;
      background:${cols[i%3]};vertical-align:middle;margin-right:6px;border-radius:2px"></span>${F.esc(F.file(s))}</span>`).join('')}
    <span style="margin-left:auto">${F.esc(unit)}</span>
  </div>
  ${srcs.length>1?`<div class="why" style="padding:0 6px 4px">Two reports, one metric. Where the
    lines separate, the company restated its own history.</div>`:''}`;
}

function abbr(v){ const a=Math.abs(v);
  if(a>=1e9) return (v/1e9).toFixed(1)+'B'; if(a>=1e6) return (v/1e6).toFixed(1)+'M';
  if(a>=1e3) return (v/1e3).toFixed(0)+'k'; return (a<10?v.toFixed(1):v.toFixed(0)); }

/* ------------------------------ dossier ------------------------------ */
function dossier(){
  const reasons = (CO.summary.abstain_reasons||[]).filter(r=>!apiish(r));
  const abstain = CO.summary.abstain && reasons.length ? `
    <div class="banner warn">
      <span class="dot" style="background:var(--amber)"></span>
      <div>${F.esc(reasons[0])}</div>
    </div>` : '';

  document.getElementById('dossier').innerHTML = `
    ${abstain}
    <div class="card">
      <p class="kicker">Score breakdown</p>
      ${SUBS.map(([k,n,d])=>subRow(k,n,d)).join('')}
    </div>

    <div class="card">
      <div class="rule-orn">Inside this issue</div>
      <div class="tabs">
        ${TABS.map(([k,l])=>`<div class="tab ${TAB===k?'on':''}" onclick="setTab('${k}')">${l}</div>`).join('')}
      </div>
      ${TAB==='evidence'?tabEvidence():TAB==='language'?tabLanguage():
        TAB==='claims'?tabClaims():tabInvestor()}
    </div>`;
}

function subRow(k,name,desc){
  const v = CO.summary.sub_scores[k];
  const reason = (CO.summary.abstain_reasons||[]).find(r=>r.startsWith(k+':') && !apiish(r));
  return `<div class="srow">
    <div><div class="sname">${name}</div><div class="why">${F.esc(desc)}</div></div>
    <div>${v==null?`<div class="na"></div><div class="why">${F.esc(reason?reason.split(': ').slice(1).join(': '):'not measurable')}</div>`
      :`<div class="bar"><i style="width:${v}%;background:${F.col(v)}"></i></div>`}</div>
    <div class="sval" style="color:${v==null?'var(--ink3)':F.col(v)}">${v==null?'n/a':F.num(v,1)}</div>
  </div>`;
}

function tabEvidence(){
  const ev = CO.drift_events.filter(e=>e.type!=='wording_softened');
  if(!ev.length) return `<p class="empty">No drift events detected.</p>`;
  return `<table><thead><tr><th>Data yr</th><th>Metric</th><th>First reported</th>
      <th>Restated to</th><th>Δ</th><th>Source</th></tr></thead><tbody>
    ${ev.map(e=>{
      const m=e.magnitude_pct;
      return `<tr>
        <td class="mono">${e.year}</td>
        <td>${F.esc(e.canonical_metric||'')}<div class="src">${e.type.replace(/_/g,' ')}</div></td>
        <td class="mono">${F.esc(e.old)}</td>
        <td class="mono">${F.esc(e.new)}</td>
        <td class="mono ${m==null?'':m>0?'up':'down'}">${m==null?'—':(m>0?'+':'')+F.num(m,1)+'%'}</td>
        <td class="src">${F.esc(F.file(e.old_source))} →<br>${F.esc(F.file(e.new_source))}${e.page?' p.'+e.page:''}</td>
      </tr>`;}).join('')}
    </tbody></table>`;
}

function tabClaims(){
  const cs = CO.claims||[];
  if(!cs.length) return `<p class="empty">No claims extracted.</p>`;
  const rows = cs.slice().sort((a,b)=>{
    const sa = Math.max(0,...(a.sins||[]).map(x=>x.severity||0));
    const sb = Math.max(0,...(b.sins||[]).map(x=>x.severity||0));
    return sb-sa || (a.features?.specificity_score||1)-(b.features?.specificity_score||1);
  });
  return `<div class="hl-legend">
      <span><mark class="hl-vague">vague</mark></span>
      <span><mark class="hl-hedge">hedge</mark></span>
      <span><mark class="hl-verify">verify</mark></span>
      <span><mark class="hl-positive">promo</mark></span>
      <span><mark class="hl-qty">number / date</mark></span>
    </div>
    ${rows.slice(0,40).map(c=>{
      const f=c.features||{}, sp=f.specificity_score;
      const slots=[['Q',f.quantification_present],['B',f.baseline_present],
                   ['D',f.date_present],['S',f.scope_present],['V',f.verification_present]];
      return `<div class="claimcard">
        <div class="meta">${c.publish_year} · p.${c.page==null?'?':c.page} · ${F.esc(c.claim_type)}
          · spec <b style="color:${sp>=0.4?'var(--leaf)':sp>=0.2?'var(--amber)':'var(--rust)'}">${sp==null?'—':sp.toFixed(2)}</b>
          · ${slots.map(([k,v])=>`<span style="color:${v?'var(--leaf)':'var(--ink3)'}">${k}</span>`).join(' ')}
          ${c.canonical_metric?` · → ${F.esc(c.canonical_metric)}`:''}
          ${c.progress_status?` · ${F.esc(c.progress_status)}`:''}</div>
        <div style="font-family:var(--serif);font-size:16.5px;line-height:1.45">${F.paint(c.claim_text, f.highlights)}</div>
        ${(c.sins||[]).map(s=>`<span class="sinchip" title="${F.esc(s.rationale||'')}">${F.esc(s.sin)}</span>`).join('')}
      </div>`;}).join('')}
    ${rows.length>40?`<p class="why">Showing 40 of ${rows.length}.</p>`:''}`;
}

function tabLanguage(){
  const L = CO.language; if(!L) return `<p class="empty">No language analysis.</p>`;
  const S = L.series||[], dc = L.drift_counts||{}, cs = L.cross_signal||{};
  const sd = L.say_do||{};
  const soft = (CO.drift_events||[]).filter(e=>e.type==='wording_softened'
    && !/boilerplate_recycled/.test(e.description));
  const pc=v=>v==null?'—':(v*100).toFixed(0)+'%';
  const nv=(v,d)=>v==null?'—':Number(v).toFixed(d);
  const links = sd.links||[];

  return `<h2 style="font-size:20px;margin-top:4px">By report year</h2>
    <table><thead><tr><th>Year</th><th>Claims</th><th>Specificity</th><th>Quantified</th>
      <th>Verified</th><th>Firm</th><th>Hedged</th><th>Say&gt;prove</th><th>Assured</th></tr></thead><tbody>
    ${S.map(r=>`<tr><td class="mono">${r.year}</td><td class="mono">${r.n_claims}</td>
      <td class="mono">${nv(r.mean_specificity,3)}</td><td class="mono">${pc(r.quantified_share)}</td>
      <td class="mono">${pc(r.verified_share)}</td><td class="mono">${pc(r.firm_share)}</td>
      <td class="mono">${pc(r.hedged_share)}</td>
      <td class="mono">${nv(r.say_more_prove_less,2)}</td>
      <td class="mono" style="color:${r.report_assured?'var(--leaf)':'var(--ink3)'}">${r.report_assured?'yes':'no'}</td></tr>`).join('')}
    </tbody></table>

    <h2 style="font-size:20px;margin-top:26px">Say vs do</h2>
    <p class="sub">${sd.n_measurable||0} links · ${sd.n_behind||0} behind
      · score ${sd.say_do_gap==null?'n/a':sd.say_do_gap}</p>
    ${links.length?`<table><thead><tr><th>Status</th><th>Metric</th><th>Target</th><th>Required now</th>
      <th>Actual</th><th>Claim</th></tr></thead><tbody>
      ${links.slice(0,12).map(lk=>`<tr>
        <td class="mono" style="color:${lk.status==='on_track'?'var(--leaf)':'var(--rust)'}">${F.esc(lk.status)}</td>
        <td class="mono">${F.esc(lk.canonical_metric||'')}</td>
        <td class="mono">${F.esc(lk.quantity||'')}${lk.deadline?' by '+lk.deadline:''}</td>
        <td class="mono">${lk.required==null?'—':Number(lk.required).toFixed(1)}</td>
        <td class="mono">${lk.actual==null?'—':Number(lk.actual).toFixed(1)} <span class="src">${lk.actual_year||''}</span></td>
        <td style="max-width:320px">${F.esc((lk.sentence||'').slice(0,160))}</td>
      </tr>`).join('')}</tbody></table>`:'<p class="empty">No target could be pinned to a verified series with comparable units.</p>'}

    <h2 style="font-size:20px;margin-top:26px">Softened wording</h2>
    <p class="sub">${dc.substantive||0} changes</p>
    ${soft.slice(0,6).map(e=>`<div class="evt">
        <div class="k">${F.esc(e.description.split(']')[0].replace('[',''))} · ${e.year}</div>
        <div class="why">${F.esc(e.description.split(']').slice(1).join(']').trim())}</div>
        <div style="font-size:14px;line-height:1.5;margin-top:6px;font-family:var(--serif)">
          <span class="src">WAS</span> ${F.esc((e.old||'').slice(0,190))}<br>
          <span class="src" style="color:var(--amber)">NOW</span> ${F.esc((e.new||'').slice(0,190))}
        </div></div>`).join('') || '<p class="empty">No substantive softening detected.</p>'}

    <h2 style="font-size:20px;margin-top:26px">Numbers and words</h2>
    <table><thead><tr><th>Year</th><th>Restatements</th>
      <th>Softenings</th><th>Both</th></tr></thead><tbody>
    ${(cs.rows||[]).map(r=>`<tr><td class="mono">${r.report_year}</td>
      <td class="mono">${r.numeric_restatements}</td>
      <td class="mono">${r.language_softenings}</td>
      <td class="mono" style="color:${r.both?'var(--amber)':'var(--ink3)'}">${r.both?'YES':'—'}</td>
    </tr>`).join('')}</tbody></table>`;
}

function tabInvestor(){
  const rows = Object.values(DATA).map(d=>({
    n:d.summary.display_name, g:d.summary.sub_scores.goalpost_drift,
    e:d.drift_events.length}))
    .sort((a,b)=>(b.g==null?-1:b.g)-(a.g==null?-1:a.g));
  return `<table><thead><tr><th>Company</th><th>Restatements</th>
      <th>Revisions</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${F.esc(r.n)}</td>
      <td class="mono" style="color:${F.col(r.g)}">${r.g==null?'n/a':F.num(r.g,1)}</td>
      <td class="mono">${r.e}</td></tr>`).join('')}
    </tbody></table>`;
}

function setTab(t){ TAB=t;
  history.replaceState(null,'','#'+CO.summary.company+(t!=='evidence'?'/'+t:''));
  dossier(); }

boot();
</script>
</body>
</html>
